# Negative control: selected by CONFORMANCE_FAULT=strip-credential-configurations.
# Record-pass fault candidate (iii): serves issuer metadata with credential_configurations_supported removed.
# Targets the shim-off record pass (metadata-test, metadata-test-signed).
# sub_filter cannot cut a nested object, so this removes the key by renaming it.
# Included inside server{} of the certify-tls templates. This file is NOT an envsubst
# template, so the upstream is literal (certify-nginx:80), not ${UPSTREAM}.
location = /.well-known/openid-credential-issuer {
    proxy_pass http://certify-nginx:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter '"credential_configurations_supported":' '"x_conformance_fault_removed":';
    sub_filter_once on;
}
