# Negative control: selected by CONFORMANCE_FAULT=rewrite-credential-issuer.
# Record-pass fault candidate (ii): serves issuer metadata whose credential_issuer differs from the issuer URL.
# Targets the shim-off record pass (metadata-test, metadata-test-signed).
# NOTE: wait-ready.sh (c_certify-from-suite) checks credential_issuer == https://certify-tls,
# so with this fault `up` will time out.
# Included inside server{} of the certify-tls templates. This file is NOT an envsubst
# template, so the upstream is literal (certify-nginx:80), not ${UPSTREAM}.
location = /.well-known/openid-credential-issuer {
    proxy_pass http://certify-nginx:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter '"credential_issuer":"https://certify-tls"' '"credential_issuer":"https://certify-tls.fault.invalid"';
    sub_filter_once on;
}
