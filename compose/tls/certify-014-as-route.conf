# Environment gap of the v0.14.0 compose nginx, not a conformance shim. Applies only to the 0.14 negative control.
# Certify 0.14 serves GET /.well-known/oauth-authorization-server in OAuthController (servlet context /v1/certify),
# but v0.14.0's certify-nginx.conf proxies only /v1/certify/, /.well-known/did.json and /.well-known/openid-credential-issuer
# at the root; any other root path is served from the static root /config/server. Route the AS metadata to Certify.
# [verified: upstream/inji-certify origin/release-0.14.x certify-service/.../OAuthController.java:48]
# [verified: data/upstream-0.14/inji-certify/docker-compose/docker-compose-injistack/certify-nginx.conf]
# [observed: evidence/sp4/SP4.4/c014-certify-shim-off.log lines 59-63: wait-ready failed only on certify-as-from-suite]
location = /.well-known/oauth-authorization-server {
    proxy_pass http://certify-nginx:80/v1/certify/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
