# Negative control: selected by CONFORMANCE_FAULT=strip-nonce-endpoint.
# Serves Certify's issuer metadata to the suite without nonce_endpoint.
# Included inside server{} of the certify-tls templates. This file is NOT an envsubst
# template, so the upstream is literal (certify-nginx:80), not ${UPSTREAM}.
location = /.well-known/openid-credential-issuer {
    proxy_pass http://certify-nginx:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter '"nonce_endpoint":"https://certify-tls/v1/certify/nonce",' '';
    sub_filter_once on;
}
