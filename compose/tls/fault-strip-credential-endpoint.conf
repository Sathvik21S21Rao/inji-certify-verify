# Negative control: selected by CONFORMANCE_FAULT=strip-credential-endpoint.
# Record-pass fault candidate (i): serves Certify's issuer metadata without credential_endpoint.
# Targets the shim-off record pass (metadata-test, metadata-test-signed).
# Included inside server{} of the certify-tls templates. This file is NOT an envsubst
# template, so the upstream is literal (certify-nginx:80), not ${UPSTREAM}.
location = /.well-known/openid-credential-issuer {
    proxy_pass http://certify-nginx:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter '"credential_endpoint":"https://certify-tls/v1/certify/issuance/credential",' '';
    sub_filter_once on;
}
