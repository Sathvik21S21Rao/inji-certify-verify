# Standalone MinIO for the S3Adapter report push (neither upstream compose has object storage).
# Run: docker compose -p minio --env-file compose/.env.pinned -f compose/minio.yml up -d --wait
# Credentials are local test values; Kernel.properties' default s3-user-key is minioadmin.
services:
  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  minio-data:
