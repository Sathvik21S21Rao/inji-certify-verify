# Standalone MinIO for the S3Adapter report push (neither upstream compose has object storage).
# Run: docker compose -p minio --env-file compose/.env.pinned -f compose/minio.yml up -d --wait
# The image has no mc, so there is no healthcheck. Check readiness from the host:
#   curl -fsS http://127.0.0.1:9000/minio/health/live
# List a bucket:
#   curl --aws-sigv4 "aws:amz:us-east-1:s3" -u minioadmin:minioadmin "http://127.0.0.1:9000/automation?list-type=2"
# Credentials are local test values; Kernel.properties' default s3-user-key is minioadmin.
# /data is tmpfs: the image runs as uid 65532 and the store is ephemeral by design.
services:
  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    tmpfs: ["/data:uid=65532,gid=65532"]
