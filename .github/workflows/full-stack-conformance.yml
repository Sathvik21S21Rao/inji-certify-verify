name: full-stack-conformance

# Negative control (a): fault=strip-nonce-endpoint with certify_shim=true must turn the certify and combined jobs red
# (observed: evidence/sp4/SP4.4/fault-certify-shim-on). With certify_shim=false the gate stays green: F-CERT-1 stops
# 12 of 14 issuer modules before any nonce use, and the metadata test does not flag the missing nonce_endpoint.
# Negative control for the benchmark of record: fault=strip-credential-endpoint (shim off) must turn the certify and
# combined jobs red (observed: evidence/sp4/SP4.8/fault-i, NEW_FAILURE in oid4vci-1_0-issuer-metadata-test).
# certify_shim=true is diagnostic only (metadata shim on), never a release result.
# A run with fault != none goes GREEN when the gate is red for exactly the recorded reason, and red otherwise
# (scripts/expect-fault.sh; rc 2/4 and unrecorded fault/shim/strict combinations stay raw). Gate output and
# artifacts are unchanged. The run-name carries fault and shim, and the diff baseline is the latest successful
# run titled "fault=none shim=false", so negative-control runs never become the baseline.
# Custom images (inputs, or a repository_dispatch "inji-release" event from a release pipeline) add "images=custom"
# to the run-name and never become the diff baseline either. Empty image = the pin in compose/.env.pinned.
#   gh api repos/<owner>/<repo>/dispatches -f event_type=inji-release \
#     -f 'client_payload[certify_image]=injistackqa/inji-certify-with-plugins:1.0.1'
# certify_ref / verify_ref (a SHA, branch or refs/pull/N/head) take the Inji compose files and api-test from that ref
# instead of the pin (scripts/fetch-upstream.sh); the run is labelled "upstream=custom" and is never the baseline.
# Inji PR CI calls this file as a reusable workflow (workflow_call): build the PR images, `docker save` them into
# one artifact, pass its name as image_artifact plus the image tags and the PR ref. Example caller:
#   jobs:
#     build: ...   # docker build -t inji-certify:pr .; docker save inji-certify:pr -o certify.tar; upload-artifact
#     conformance:
#       needs: build
#       uses: Sathvik21S21Rao/inji-certify-verify/.github/workflows/full-stack-conformance.yml@main
#       with: {image_artifact: pr-images, certify_image: 'inji-certify:pr', certify_ref: '${{ github.event.pull_request.head.sha }}'}
# A caller in another repo needs this repo to be public (or shared with it); the badge job never runs there.
run-name: "full-stack-conformance fault=${{ inputs.fault || 'none' }} shim=${{ inputs.certify_shim || 'false' }}${{ (inputs.certify_image || inputs.verify_image || github.event.client_payload.certify_image || github.event.client_payload.verify_image) && ' images=custom' || '' }}${{ (inputs.certify_ref || inputs.verify_ref || github.event.client_payload.certify_ref || github.event.client_payload.verify_ref) && ' upstream=custom' || '' }}"
on:
  workflow_dispatch:
    inputs:
      strict:
        description: Gate red on any suite WARNING (ADR-003 --strict)
        type: boolean
        default: false
      parallel:
        description: Run combined configs in parallel
        type: boolean
        default: false
      fault:
        description: Fault injection
        type: choice
        options: [none, strip-nonce-endpoint, strip-credential-endpoint]
        default: none
      certify_shim:
        description: Certify AS metadata shim (diagnostic only)
        type: choice
        options: ['false', 'true']
        default: 'false'
      certify_image:
        description: Certify image to test instead of the pin (e.g. injistackqa/inji-certify-with-plugins:1.0.1)
        type: string
        default: ''
      verify_image:
        description: Verify service image to test instead of the pin (e.g. injistackqa/inji-verify-service:1.0.1)
        type: string
        default: ''
      certify_ref:
        description: inji-certify ref for compose files and api-test instead of the pin (SHA, branch, refs/pull/N/head)
        type: string
        default: ''
      verify_ref:
        description: inji-verify ref for compose files and api-test instead of the pin (SHA, branch, refs/pull/N/head)
        type: string
        default: ''
  workflow_call:
    inputs:
      certify_image: {type: string, default: '', description: Certify image instead of the pin}
      verify_image: {type: string, default: '', description: Verify service image instead of the pin}
      certify_ref: {type: string, default: '', description: inji-certify ref instead of the pin}
      verify_ref: {type: string, default: '', description: inji-verify ref instead of the pin}
      image_artifact: {type: string, default: '', description: 'Artifact of `docker save` *.tar files, loaded before the run'}
      strict: {type: boolean, default: false, description: Gate red on any suite WARNING}
      harness_repository: {type: string, default: Sathvik21S21Rao/inji-certify-verify, description: This harness repo}
      harness_ref: {type: string, default: main, description: Harness ref to run}
      skip_badge: {type: boolean, default: true, description: 'Leave true: the badge job would write to the caller repo'}
    secrets:
      harness_token:
        description: Token that can read the harness repo (only while it is private)
        required: false
  repository_dispatch:
    types: [inji-release]
  push:
    tags: ['v*', 'release-*']

permissions:
  contents: read
  actions: read

concurrency:
  group: full-stack-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [certify, verify, combined]
    steps:
      - uses: actions/checkout@v4
        with:   # under workflow_call, github.repository is the caller, so name the harness explicitly
          repository: ${{ inputs.harness_repository || github.repository }}
          ref: ${{ inputs.harness_ref || '' }}
          token: ${{ secrets.harness_token || github.token }}
      - if: inputs.image_artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image_artifact }}
          path: ${{ runner.temp }}/images
      - name: Load images
        if: inputs.image_artifact
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: compose/.env.pinned   # no pom.xml here; the pins decide the Maven deps
      - run: pip install -r runner/requirements.txt
      - name: Ensure suite hostname resolves
        run: |
          getent hosts localhost.emobix.co.uk || echo "127.0.0.1 localhost.emobix.co.uk" | sudo tee -a /etc/hosts
      - name: Run conformance
        env:
          CONFORMANCE_PYTHON: python
          CONFORMANCE_FAULT: ${{ inputs.fault || 'none' }}
          CONFORMANCE_CERTIFY_AS_METADATA_SHIM: ${{ inputs.certify_shim || 'false' }}
          CERTIFY_IMAGE: ${{ inputs.certify_image || github.event.client_payload.certify_image || '' }}
          VERIFY_SERVICE_IMAGE: ${{ inputs.verify_image || github.event.client_payload.verify_image || '' }}
          INJI_CERTIFY_REF: ${{ inputs.certify_ref || github.event.client_payload.certify_ref || '' }}
          INJI_VERIFY_REF: ${{ inputs.verify_ref || github.event.client_payload.verify_ref || '' }}
          TARGET: ${{ matrix.target }}
          STRICT: ${{ inputs.strict }}
          PARALLEL: ${{ inputs.parallel }}
        run: |
          args=(--out reports)
          if [ "$TARGET" = combined ]; then
            args+=(--combined)
            [ "$PARALLEL" = true ] && args+=(--parallel)
          else
            args+=(--component "$TARGET")
          fi
          [ "$STRICT" = true ] && args+=(--strict)
          rc=0
          scripts/run-conformance.sh "${args[@]}" || rc=$?
          scripts/expect-fault.sh "$TARGET" "$CONFORMANCE_FAULT" "$CONFORMANCE_CERTIFY_AS_METADATA_SHIM" "$STRICT" "$rc" reports
      - name: Job summary
        if: always()
        run: |
          {
            echo '## Run info'
            echo '```'
            cat reports/run-info.txt 2>/dev/null || echo "no run-info.txt"
            echo '```'
            for f in reports/*/gate.md reports/*/reconcile.md reports/*/benchmark-update.md; do [ -f "$f" ] && { echo "### $f"; cat "$f"; }; done
            if [ -f reports/timing.tsv ]; then
              echo '### timing'
              echo '```'
              cat reports/timing.tsv
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diff against previous successful run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo '## Diff vs previous successful run' >> "$GITHUB_STEP_SUMMARY"
          id=$(gh run list --branch "$DEFAULT_BRANCH" --workflow full-stack-conformance.yml --status success -L 20 --json databaseId,displayTitle -q '[.[] | select((.displayTitle | contains("fault=none shim=false")) and (.displayTitle | contains("images=custom") | not) and (.displayTitle | contains("upstream=custom") | not))][0].databaseId // empty' || true)
          if [ -n "$id" ]; then gh run download "$id" -n "conformance-$TARGET" -D prev || true; fi
          found=0
          for f in reports/*/results.jsonl; do
            [ -f "$f" ] || continue
            cfg=$(basename "$(dirname "$f")")
            p="prev/$cfg/results.jsonl"
            [ -f "$p" ] || continue
            found=1
            { echo "### $cfg"; python -m runner diff "$p" "$f"; } >> "$GITHUB_STEP_SUMMARY" || true
          done
          [ "$found" = 1 ] || echo "no previous successful run to diff against" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.target }}
          path: reports/
          if-no-files-found: warn
      - name: Final teardown
        if: always()
        run: scripts/env.sh down all || true

  # Publishes reports/combined/badge.{svg,json} to the single-commit `badges` branch, which the README embeds.
  # Record runs only: default branch or a tag, no fault, shim off, not strict, pinned upstream, not a workflow_call. Custom images (a release dispatch)
  # do publish, since the badge should show the newest release tested. Only this job can write to the repo.
  badge:
    needs: conformance
    if: >-
      always() && needs.conformance.result != 'cancelled'
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
      && (inputs.fault || 'none') == 'none' && (inputs.certify_shim || 'false') == 'false' && inputs.strict != true
      && inputs.skip_badge != true && !inputs.certify_ref && !inputs.verify_ref
      && !github.event.client_payload.certify_ref && !github.event.client_payload.verify_ref
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: conformance-combined
          path: art
      - name: Push badge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          [ -f art/combined/badge.svg ] || { echo "::warning::no combined badge in this run; badge not updated"; exit 0; }
          mkdir b && cp art/combined/badge.svg art/combined/badge.json b/ && cd b
          git init -q -b badges
          git add badge.svg badge.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "badge from run $RUN"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" badges
